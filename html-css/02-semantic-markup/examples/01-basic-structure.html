<!DOCTYPE html>
<!-- Атрибут lang — важливий для доступності (screen reader обирає правильну мову озвучення) і для SEO-->
<html lang="uk">
<!-- <head> — метадані, не відображаються на сторінці: -->
<head>
    <meta charset="UTF-8">
    <!-- <title> — унікальний для кожної сторінки, відображається у вкладці браузера та в результатах пошуку -->
    <title>Заголовок сторінки</title>
</head>
<!--<body> — видимий контент сторінки, текст, зображення, семантичні блоки, форми, інтерактивні елементи — усе, що бачить користувач-->
<body>
<header>...</header>
<main>...</main>
<footer>...</footer>
</body>
</html>
