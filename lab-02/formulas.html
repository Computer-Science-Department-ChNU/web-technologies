<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Formulas</title>

    <style>
        body {
            background-color: #242424;
            color: #d8dee9;
            font-family: "Courier New", monospace;
            font-size: 20px;
            line-height: 1.8;
        }

        ol {
            margin-top: 20px;
        }

        li {
            padding-left: 5px;
        }

        em {
            font-style: normal;
        }
    </style>
</head>

<body>

    <h1>Хімічні та математичні формули</h1>

    <ol>
        <li><em>Вода: </em>H<sub>2</sub>O</li>

        <li><em>Сірчана кислота</em>: H<sub>2</sub>SO<sub>4</sub></li>

        <li><em>Глюкоза: </em>C<sub>6</sub>H<sub>12</sub>O<sub>6</sub></li>

        <li><em>Карбонат кальцію: </em>CaCO<sub>3</sub></li>

        <li>
            <em>Реакція горіння метану: </em>CH<sub>4</sub> + 2O<sub>2</sub> → CO<sub>2</sub> + 2H<sub>2</sub>O
        </li>

        <li>
            <em>Квадратне рівняння: </em>ax<sup>2</sup> + bx + c = 0
        </li>

        <li>
            <em>Число Авогадро: </em>6,022 · 10<sup>23</sup> моль<sup>-1</sup>
            
        </li>
    </ol>

</body>
</html>
