<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Завдання 2. Мондріан</title>
  <style>
    body { display: flex; flex-direction: column; align-items: center; text-align: center; font-family: Arial, sans-serif; }
    table { border-collapse: collapse; table-layout: fixed; border: 8px solid #000; }
    td { border: 8px solid #000; padding: 0; }
    tr:nth-child(1) { height: 50px; }
    tr:nth-child(2) { height: 120px; }
    tr:nth-child(3) { height: 115px; }
    tr:nth-child(4) { height: 60px; }
    tr:nth-child(5) { height: 60px; }
    tr:nth-child(6) { height: 30px; }
    tr:nth-child(7) { height: 40px; }
    .r { background: #ff5b2d; }
    .y { background: #fffa69; }
    .b { background: #074481; }
    .w { background: #ffffff; }
    .k { background: #000000; }
  </style>
</head>
<body>
  <h1>Завдання 2. Композиція з червоним, синім і жовтим</h1>
  <table>
    <colgroup>
      <col width="50"><col width="60"><col width="70"><col width="120"><col width="75"><col width="75">
    </colgroup>
    <tr><td class="w" colspan="2"></td><td class="w" colspan="2"></td><td class="y" colspan="2"></td></tr>
    <tr><td class="w"></td><td class="r" colspan="3" rowspan="2"></td><td class="y" colspan="2"></td></tr>
    <tr><td class="w" rowspan="2"></td><td class="w"></td><td class="w"></td></tr>
    <tr><td class="k" colspan="2" rowspan="2"></td><td class="w"></td><td class="w" colspan="2"></td></tr>
    <tr><td class="y" rowspan="3"></td><td class="w"></td><td class="b" colspan="2" rowspan="2"></td></tr>
    <tr><td class="w" colspan="2" rowspan="2"></td><td class="k"></td></tr>
    <tr><td class="w" colspan="3"></td></tr>
  </table>
  <p><a href="../index.html">Повернутись на головну</a></p>
</body>
</html>
