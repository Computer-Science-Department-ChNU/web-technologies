<!DOCTYPE html>
<html lang="en">
<head>
    <!--  кодування символів  -->
    <meta charset="UTF-8">
    <!--  коректне масштабування на мобільних пристроях і напряму впливає на мобільне ранжування (mobile-first indexing) -->
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Document</title>
    <!--  опис сторінки для видачі пошукових систем  -->
    <meta name="description" content="...">
    <!--  інструкції для пошукових роботів  -->
    <meta name="robots" content="index, follow">
    <!--  запобігає проблемі дублювання контенту  -->
    <link rel="canonical" href="">
    <!--  Open Graph: розмітка для соцмереж  -->
    <meta property="og:title" content="Заголовок">
    <meta property="og:description" content="Опис">
    <meta property="og:image" content="https://example.com/image.jpg">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://example.com">
</head>
<body>
<p>title та description - формують сніппет у видачі Google, впливають на CTR (Click-Through Rate або показник
    клікабельності)</p>
<p>Формула: CTR = (Кількість кліків / Кількість показів) * 100%</p>
<p>Якщо оголошення побачили 100 разів і на нього клікнули 5 разів, то CTR дорівнює 5%</p>
</body>
</html>
